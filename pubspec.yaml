name: flight_assistant
description: Mobile Flight Assistant for general aviation pilots.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  drift: ^2.32.1
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.0
  go_router: ^14.8.1
  maplibre: ^0.3.5
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
  drift_dev: ^2.32.1
  build_runner: ^2.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/aviation_data/airports_pl.geojson
    - assets/aviation_data/vfr_points_pl.geojson
    - assets/aviation_data/airspaces_pl.geojson
